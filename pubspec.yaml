name: study_manager
description: "A new Flutter project."
publish_to: 'none' 


version: 1.0.13+14

environment:
  sdk: ^3.11.4


dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  open_filex: ^4.3.4
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  sqflite: ^2.4.2+1
  path: ^1.9.1
  flutter_dotenv: ^6.0.1
  fl_chart: ^1.2.0
  skeletonizer: ^2.1.3
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.1.0
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/Icon_StudyManager.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7B2FBE"
  adaptive_icon_foreground: "assets/icons/Icon_StudyManager.png"




flutter:

  uses-material-design: true

  assets:
    - assets/images/login_bg.jpg
    - assets/images/splash_bg.png
    - assets/images/splash_icon.png